	#  Цвет контур количества стаков
	#  Цвет контура количества стаков в стиле Create
	countOutlineColor = 0xFF383838
# JEI
[misc.jei]
	#  Включить показ больших крафтов
	#  Показ рецептов механического крафта размером более 3×3 (например, 5×5) для фабричных контроллеров и запросов на поставку
