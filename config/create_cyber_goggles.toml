	#  Рекурсивное сканирование схематик
	#  Включить схематики в подпапках при обновлении списка
	recursiveSchematicScan = true
	#  Фикс названия схематик
	#  Разрешить использовать символы, отличные от ASCII в названиях схематик
	fixSchematicName = true
	#  Автопополнение склада
	#  Show the 'Auto Replenish Stock' button in the stock keeper's schematic mode: recursively expands recipes from the clipboard list and orders them in one click
