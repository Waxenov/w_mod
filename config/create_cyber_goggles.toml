	#  Вертикальное смещение оверлея
	#  Положительное: вниз, отрицательное: вверх
	overlayPos = { x = 0, y = 0 }
	#  Тип подсказки
	#  Выбрать тип отображения подсказки
	tooltipFlagType = "Advanced"
	#  Тема подсказки
	#  Тема отображения подсказки
	tooltipTheme = "Create"
	#  Использовать пользовательские цвета
	#  Использовать пользовательские цвета для фона и границ оверлея
	useCustomColor = false
	#  Цвет фона
	#  Пользовательский цвет фона
	backgroundColor = 0x00000000
	#  Цвет верхней границы
	#  Пользовательский цвет верхней границы
	borderTopColor = 0x00000000
	#  Цвет нижней границы
	#  Пользовательский цвет нижней границы
	borderBottomColor = 0x00000000
# Вид диаграммы штуковины
[overlay.draftingView]
	#  Включить вид чертежа
	#  Эффект постобработки схематики для экрана
	draftingViewEnabled = false
	#  Смещение палитры
	#  Горизонтальное смещение (0..1) в текстуре палитры
