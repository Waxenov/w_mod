	#  Масштаб пикселей
	#  Каждый виртуальный пиксель покрывает указанное количество пикселей экрана (1 = выключено, 4 = по умолчанию, большее значение = более крупное изображение).
	pixelScale = 4.0
	#  Цвет линии
	#  Цвет обводки контуров
	lineColor = 0x2E3032
	#  Цвет тени линии
	#  Цвет тени для контуров с глубиной
	lineShadowColor = 0x696965
# Линии и контуры
[outliner]
	#  Отображать линию и обводку блоков
	#  Отображать линию и обводку блоков, на которые смотрит игрок
