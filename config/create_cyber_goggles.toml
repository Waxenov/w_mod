	enableNegativeInfThrottle = false
	#  Принудительный бэкенд отрисовки
	#  Принудительно использовать определённый бэкенд отрисовки, может решить проблемы с производительностью или совместимостью на некоторых системах
	forcedBackend = false
	#  NBT фикс
	#  Фикс отображения NBT данных, который может вызвать проблемы с производительностью
	nbtFix = false
	#  Sound Pool Limit
	#  Number of OpenAL sound sources to request; increasing it mitigates silent failures caused by sound pool overflow
	soundPoolLimit = 255
