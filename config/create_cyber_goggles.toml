	#  Оптимизация обработки рецептов
	#  Ускорить передачу рецептов в запросы сети
	optimizeRecipeProcessing = true
	#  Запрос редстоунового запрашивателя через JEI
	#  Отображать кнопку переноса рецепта JEI в редстоуновом запрашивателе для заполнения ингредиентов на основе запасов сети
	redstoneRequesterJEIRequest = true
	#  Показывать информацию о мусоре
	#  Показывать детальную информацию о мусоре при последовательной сборке
	showScrapContent = true
	#  Быстрые действия с запросами
	#  Включить быстрые действия на экранах складского тикера и запрашивателя
	quickRequestActions = true
	#  Убрать ограничение запроса
	#  Убрать ограничение количества запросов для фабричных контроллеров и редстоуновых запрашивателей, оптимизировать быстрое прокручивание
