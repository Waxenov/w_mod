	#  Убрать ограничение для механических рук
	#  Убрать ограничение расстояния для механических рук
	removeMechanicalArmLimit = false
	#  Remove Package Frogport Down Limit
	#  Allow placing Package Frogports above the target
	removePackagePortDownLimit = false
	#  Бесконечная длина поля ввода
	#  Бесконечная длина поля ввода (2^31 - 1)
	infEditBoxLength = false
	#  Убрать оверлей картонной брони
	#  Убрать оверлей картонной брони при приседании
	removeCardboardOverlay = true
	#  Убрать отрисовку в первом лице для незеритового баллона
	#  Убрать отрисовку незеритового баллона в первом лице
	removeNetheriteFirstPerson = false
	#  Предотвращать сброс выделения
	#  Предотвратить сброс выделения при переключении предметов
	preventSelectionDiscard = true
	#  Предотвратить закрытие фильтра
	#  Предотвращение автоматического закрытия экрана фильтра
	preventAutoCloseFilter = false
	#  Разрешить водолазные ботинки
