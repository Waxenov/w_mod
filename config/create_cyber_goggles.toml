# Очки
[goggles]
# Режим игры
[goggles.gameMode]
	#  Включить очки
	#  Главный выключатель для очков
	enableGoggles = true
	#  Включить в режиме выживания
	#  Всегда включать очки в режиме выживания
	enableInSurvival = true
	#  Включить в творческом режиме
	#  Всегда включать очки в творческом режиме
	enableInCreative = false
	#  Включить в режиме наблюдателя
	#  Всегда включать очки в режиме наблюдателя
	enableInSpectator = false
	#  Включить в режиме «Приключение»
	#  Всегда включать очки в режиме «Приключение»
	enableInAdventure = true
	#  Улучшенное отображение информации
	#  Отображать больше информации с помощью очков
	enhancedInfo = true
	#  Скрыть кинетическую информацию для статических блоков в очках
	#  Скрыть кинетическую информацию для статических блоков в очках
	hideStaticKineticInfo = true
	#  Только в очках
	#  Привязывает большинство дополнительных функций отображения к очкам. Зависит от опции "Включить очки"
	onlyOnWithGoggles = true
	#  Улучшенная информация о магазине
	#  Оптимизировать отображение и логику взаимодействия с информацией о магазине
	betterStoreInfo = true
	#  Улучшенное соединение для фабричных контроллеров
	#  Позволяет подключать и перемещать заводские контроллеры без ограничений
	betterFactoryGauge = true
	#  Отображение кинетических частиц
	#  Отображать эффекты частиц вращения для блоков с кинетической информацией
	enableKineticEffect = true
	#  Отключить очки на экране
	#  Отключить отображение очков, когда любой экран открыт
	disableInScreenGoggles = true
	#  Отображение с значением прокрутки
	#  Разрешить отображение подсказки очков, когда значение прокрутки видимо
	canRenderOnValueBox = true
	#  Включить затухание
	#  Включить плавное затухание наложения предмета и наложения очков
	enableFadeOut = true
	#  Точные числа
	#  Отображать более точные числовые значения
	preciseNumber = true
	#  Макс. количество знаков после запятой
	#  Максимальное количество знаков после запятой, используемое для точных чисел
	maxFractionDigits = 2
