[appearance]
	# Название: Поле поиска по центру
	# Описание: Перемещает поле поиска JEI в центр нижней части экрана.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	centerSearch = false

	# Название: Максимальная высота интерфейса рецепта
	# Описание: Максимальная высота интерфейса рецепта.
	# Допустимые значения: Any integer greater than or equal to 175
	# Значение по умолчанию: 350
	recipeGuiHeight = 350

	# Название: Перекомпоновка уведомлений
	# Описание: Резервирует место для всплывающих уведомлений, чтобы они не перекрывали интерфейс JEI.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	toastReflowEnabled = true


[cheating]
	# Название: Режим выдачи
	# Описание: Выберите способ выдачи ингредиентов через JEI: сразу в инвентарь или на курсор мыши.
	# Допустимые значения: [INVENTORY, MOUSE_PICKUP]
	# Значение по умолчанию: MOUSE_PICKUP
	giveMode = MOUSE_PICKUP

	# Название: Получать предметы на панель быстрого доступа клавишами
	# Описание: Разрешает получать предметы на панель быстрого доступа сочетанием Shift и цифровых клавиш.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	cheatToHotbarUsingHotkeysEnabled = false

	# Название: Показывать скрытые ингредиенты
	# Описание: Показывать ингредиенты, отсутствующие в меню Творческого режима.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	showHiddenIngredients = false

	# Название: Показывать рецепты тегов
	# Описание: Показывать рецепты тегов ингредиентов, включая теги предметов и блоков.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	showTagRecipesEnabled = false


[bookmarks]
	# Название: Добавлять новые закладки в начало
	# Описание: Когда включено, добавляет новые закладки в начало списка закладок. Когда выключено, добавляет новые закладки в конец списка закладок
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	addBookmarksToFrontEnabled = false

	# Название: Добавлять результат в закладки как рецепт
	# Описание: Если включено, нажатие клавиши закладки на результате рецепта добавит в закладки сам рецепт, а не ингредиент.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	bookmarkOutputAsRecipe = true

	# Название: Перетаскивать закладки для изменения порядка
	# Описание: Разрешает менять порядок закладок перетаскиванием.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	dragToRearrangeBookmarksEnabled = true


[tooltips]
	# Название: Возможности подсказок закладок
	# Описание: Дополнительные возможности подсказок закладок.
	# Допустимые значения: A comma-separated list containing values of:
	# [PREVIEW, INGREDIENTS]
	# Значение по умолчанию: PREVIEW
	bookmarkTooltipFeatures = PREVIEW

	# Название: Shift для подсказок закладок
	# Описание: Удерживайте Shift для дополнительных сведений в подсказках закладок.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	holdShiftToShowBookmarkTooltipFeatures = true

	# Название: Показывать названия вкладок Творческого режима
	# Описание: Показывать названия вкладок Творческого режима в подсказках ингредиентов.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	showCreativeTabNamesEnabled = false

	# Название: Показывать содержимое тегов
	# Описание: Показывать содержимое тегов в подсказках ингредиентов рецептов.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	tagContentTooltipEnabled = true

	# Название: Скрывать содержимое тегов с одним ингредиентом
	# Описание: Не показывать содержимое тега, если в нём только один ингредиент.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	hideSingleTagContentTooltipEnabled = true

	# Название: Сводка ингредиентов рецепта
	# Описание: Показывать сводку необходимых ингредиентов в подсказке результата рецепта.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	enableRecipesGuiIngredientsSummary = false


[performance]
	# Название: Поиск с малым расходом памяти
	# Описание: Использовать режим поиска с малым расходом памяти. Он работает медленнее, но потребляет меньше ОЗУ.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	lowMemorySlowSearchEnabled = false


[lookups]
	# Название: Искать содержимое жидкостей
	# Описание: При поиске рецептов предметов с жидкостями также искать рецепты самих жидкостей.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	lookupFluidContentsEnabled = false

	# Название: Искать теги соответствующих блоков
	# Описание: При поиске тегов предметов также учитывать теги соответствующих блоков.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	lookupBlockTagsEnabled = true


[lookupHistory]
	# Название: Включено
	# Описание: Показывать или скрывать панель истории поиска.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	enabled = false

	# Название: Максимум строк
	# Описание: Максимальное число строк на панели истории поиска.
	# Допустимые значения: An integer in the range [1, 7] (inclusive)
	# Значение по умолчанию: 2
	maxRows = 2

	# Название: Максимум ингредиентов
	# Описание: Максимальное число сохраняемых ингредиентов в истории поиска.
	# Допустимые значения: An integer in the range [10, 1000] (inclusive)
	# Значение по умолчанию: 100
	maxIngredients = 100

	# Название: Сторона экрана
	# Описание: Сторона экрана для панели истории поиска.
	# Допустимые значения: [LEFT, RIGHT]
	# Значение по умолчанию: LEFT
	displaySide = LEFT


[advanced]
	# Название: Перехватывать ошибки отрисовки
	# Описание: Перехватывать ошибки отрисовки ингредиентов из модов и пытаться продолжить работу вместо аварийного завершения.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	catchRenderErrorsEnabled = true

	# Название: Recipe Sync Warning
	# Описание: Show a chat warning when the server doesn't provide synced recipes to JEI (e.g. vanilla servers, or servers without JEI installed).
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	recipeSyncWarningEnabled = true


[input]
	# Название: Задержка перетаскивания
	# Описание: Число миллисекунд удержания кнопки мыши до начала перетаскивания.
	# Допустимые значения: An integer in the range [0, 1000] (inclusive)
	# Значение по умолчанию: 150
	dragDelayInMilliseconds = 150

	# Название: Скорость плавной прокрутки
	# Описание: Скорость прокрутки колёсиком в областях с плавной прокруткой, измеряемая в пикселях.
	# Допустимые значения: An integer in the range [1, 50] (inclusive)
	# Значение по умолчанию: 9
	smoothScrollRate = 9

	# Название: Recipe Slot Cycling
	# Описание: Automatically cycle through ingredients in recipe slots over time.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	recipeSlotCyclingEnabled = true


[sorting]
	# Название: Этапы сортировки ингредиентов
	# Описание: Порядок сортировки списка ингредиентов.
	# Допустимые значения: A comma-separated list containing values of:
	# [MOD_NAME, INGREDIENT_TYPE, ALPHABETICAL, CREATIVE_MENU, TAG, ARMOR, MAX_DURABILITY]
	# Значение по умолчанию: MOD_NAME, INGREDIENT_TYPE, CREATIVE_MENU
	ingredientSortStages = MOD_NAME, INGREDIENT_TYPE, CREATIVE_MENU

	# Название: Этапы сортировки рецептов
	# Описание: Порядок сортировки отображаемых рецептов.
	# Допустимые значения: A comma-separated list containing values of:
	# [BOOKMARKED, CRAFTABLE]
	# Значение по умолчанию: BOOKMARKED, CRAFTABLE
	recipeSorterStages = BOOKMARKED, CRAFTABLE


[search]
	# Название: @Название мода
	# Описание: Режим поиска по названиям мода (префикс: @).
	# Допустимые значения: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Значение по умолчанию: REQUIRE_PREFIX
	modNameSearchMode = REQUIRE_PREFIX

	# Название: #Тег
	# Описание: Режим поиска по тегам (префикс: #).
	# Допустимые значения: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Значение по умолчанию: REQUIRE_PREFIX
	tagSearchMode = REQUIRE_PREFIX

	# Название: $Подсказка
	# Описание: Режим поиска по подсказкам (префикс: $).
	# Допустимые значения: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Значение по умолчанию: ENABLED
	tooltipSearchMode = ENABLED

	# Название: ^Цвет
	# Описание: Режим поиска по цветам (префикс: ^).
	# Допустимые значения: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Значение по умолчанию: DISABLED
	colorSearchMode = DISABLED

	# Название: &Идентификатор ресурса
	# Описание: Режим поиска по идентификаторам ресурсов (префикс: &).
	# Допустимые значения: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Значение по умолчанию: DISABLED
	resourceLocationSearchMode = DISABLED

	# Название: %Поиск по творческой вкладке
	# Описание: Режим поиска по названиям творческих вкладок (префикс: %).
	# Допустимые значения: [ENABLED, REQUIRE_PREFIX, DISABLED]
	# Значение по умолчанию: DISABLED
	creativeTabSearchMode = DISABLED

	# Название: Искать в расширенных подсказках
	# Описание: Искать в расширенных подсказках, отображаемых после F3 + H.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	searchAdvancedTooltips = false

	# Название: Искать идентификаторы модов
	# Описание: Искать не только названия, но и идентификаторы модов.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	searchModIds = true

	# Название: Искать альтернативные названия модов
	# Описание: Искать добавленные плагинами альтернативные названия модов.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	searchModAliases = true

	# Название: Искать сокращения названий модов
	# Описание: Искать моды по первым буквам слов в названии.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	searchShortModNames = false

	# Название: Искать альтернативные названия ингредиентов
	# Описание: Искать добавленные плагинами альтернативные названия ингредиентов.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: true
	searchIngredientAliases = true


[ingredientList]
	# Название: Максимум строк
	# Описание: Максимальное число отображаемых строк.
	# Допустимые значения: An integer in the range [1, 100] (inclusive)
	# Значение по умолчанию: 16
	maxRows = 16

	# Название: Максимум столбцов
	# Описание: Максимальное число отображаемых столбцов.
	# Допустимые значения: An integer in the range [2, 100] (inclusive)
	# Значение по умолчанию: 9
	maxColumns = 9

	# Название: Горизонтальное выравнивание
	# Описание: Горизонтальное выравнивание списка ингредиентов в доступной области.
	# Допустимые значения: [LEFT, CENTER, RIGHT]
	# Значение по умолчанию: RIGHT
	horizontalAlignment = RIGHT

	# Название: Вертикальное выравнивание
	# Описание: Вертикальное выравнивание списка ингредиентов в доступной области.
	# Допустимые значения: [TOP, CENTER, BOTTOM]
	# Значение по умолчанию: TOP
	verticalAlignment = TOP

	# Название: Видимость навигации
	# Описание: Видимость элементов навигации, таких как кнопки страниц и полосы прокрутки. AUTO_HIDE показывает их только тогда, когда список не помещается целиком.
	# Допустимые значения: [ENABLED, AUTO_HIDE, DISABLED]
	# Значение по умолчанию: ENABLED
	navigationVisibility = ENABLED

	# Название: Рисовать фон интерфейса
	# Описание: Рисовать фоновую текстуру за списком ингредиентов.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	drawBackground = false

	# Название: Layout Mode
	# Описание: RECTANGULAR keeps page navigation aligned to the ingredient grid while still allowing excluded grid slots to be cut out. MAXIMIZE_AVAILABLE_SPACE can resize and shift page navigation around excluded areas.
	# Допустимые значения: [RECTANGULAR, MAXIMIZE_AVAILABLE_SPACE]
	# Значение по умолчанию: RECTANGULAR
	layoutMode = RECTANGULAR

	# Название: Режим навигации
	# Описание: Выберите PAGED для кнопок страниц, SCROLLING для построчной полосы прокрутки или SMOOTH_SCROLLING для плавной прокрутки.
	# Допустимые значения: [PAGED, SCROLLING, SMOOTH_SCROLLING]
	# Значение по умолчанию: PAGED
	navigationMode = PAGED


[bookmarkList]
	# Название: Максимум строк
	# Описание: Максимальное число отображаемых строк.
	# Допустимые значения: An integer in the range [1, 100] (inclusive)
	# Значение по умолчанию: 16
	maxRows = 16

	# Название: Максимум столбцов
	# Описание: Максимальное число отображаемых столбцов.
	# Допустимые значения: An integer in the range [2, 100] (inclusive)
	# Значение по умолчанию: 9
	maxColumns = 9

	# Название: Горизонтальное выравнивание
	# Описание: Горизонтальное выравнивание списка закладок в доступной области.
	# Допустимые значения: [LEFT, CENTER, RIGHT]
	# Значение по умолчанию: LEFT
	horizontalAlignment = LEFT

	# Название: Вертикальное выравнивание
	# Описание: Вертикальное выравнивание списка закладок в доступной области.
	# Допустимые значения: [TOP, CENTER, BOTTOM]
	# Значение по умолчанию: TOP
	verticalAlignment = TOP

	# Название: Видимость навигации
	# Описание: Видимость элементов навигации, таких как кнопки страниц и полосы прокрутки. AUTO_HIDE показывает их только тогда, когда список не помещается целиком.
	# Допустимые значения: [ENABLED, AUTO_HIDE, DISABLED]
	# Значение по умолчанию: ENABLED
	navigationVisibility = ENABLED

	# Название: Рисовать фон интерфейса
	# Описание: Рисовать фоновую текстуру за списком закладок.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	drawBackground = false

	# Название: Layout Mode
	# Описание: RECTANGULAR keeps page navigation aligned to the bookmark grid while still allowing excluded grid slots to be cut out. MAXIMIZE_AVAILABLE_SPACE can resize and shift page navigation around excluded areas.
	# Допустимые значения: [RECTANGULAR, MAXIMIZE_AVAILABLE_SPACE]
	# Значение по умолчанию: RECTANGULAR
	layoutMode = RECTANGULAR

	# Название: Режим навигации
	# Описание: Выберите PAGED для кнопок страниц, SCROLLING для построчной полосы прокрутки или SMOOTH_SCROLLING для плавной прокрутки.
	# Допустимые значения: [PAGED, SCROLLING, SMOOTH_SCROLLING]
	# Значение по умолчанию: PAGED
	navigationMode = PAGED


