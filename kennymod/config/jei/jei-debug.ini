[debug]
	# Название: Отладка ингредиентов
	# Описание: Записывать в журнал добавленные и обновлённые ингредиенты в фильтре ингредиентов JEI.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugIngredientsEnabled = false

	# Название: Отладка интерфейсов
	# Описание: Включить режим отладки интерфейсов.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugGuis = false

	# Название: Отладка управления
	# Описание: Включить режим отладки управления.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugInputs = false

	# Название: Отладочные сведения в подсказках
	# Описание: Добавлять отладочные сведения в подсказки ингредиентов при включённых расширенных подсказках.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	debugInfoTooltipsEnabled = false

	# Название: Записывать статистику дерева поиска
	# Описание: Записывать сведения о суффиксных деревьях поиска для отладки JEI.
	# Допустимые значения: [true, false]
	# Значение по умолчанию: false
	logSuffixTreeStats = false


